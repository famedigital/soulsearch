<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Soul Search Tours">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8E6"/>
      <stop offset="55%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#0A1C28"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="50%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#63D9A6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 256)" filter="url(#soft)">
    <circle r="168" fill="#F7FCFA" fill-opacity="0.08"/>
    <circle r="148" fill="none" stroke="#63D9A6" stroke-opacity="0.35" stroke-width="6"/>
    <circle r="120" fill="url(#mark)"/>
    <text
      x="0"
      y="18"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="118"
      font-weight="700"
      fill="#123047"
      letter-spacing="-4"
    >SS</text>
  </g>
</svg>
