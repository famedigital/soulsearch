<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Soul Search Tours">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22B8E6"/>
      <stop offset="55%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#0A1C28"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="50%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#63D9A6"/>
    </linearGradient>
  </defs>

  <!-- Safe zone for maskable / adaptive icons -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <circle r="132" fill="url(#mark)"/>
    <text
      x="0"
      y="16"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="104"
      font-weight="700"
      fill="#123047"
      letter-spacing="-4"
    >SS</text>
  </g>
</svg>
